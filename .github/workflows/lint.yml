name: Auto Linter

on:
  push:
    paths:
      - '**.py'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linter
        run: pip install ruff

      - name: Checks the file for linting
        run: ruff check .
